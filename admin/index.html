<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RHUYS VOLLEY BALL | Decap CMS</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f8fc;
      }

      .cms-local-note {
        display: none;
        margin: 1rem;
        border-radius: 14px;
        padding: 1rem;
        background: #fff7d6;
        color: #10233f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <noscript>Activez JavaScript pour accéder à l'administration du site.</noscript>
    <p class="cms-local-note" id="cms-local-note">
      Decap CMS avec Netlify Identity fonctionne sur le site Netlify déployé. En local, utilisez le mode de test Decap ou
      ouvrez https://rhuys-volley-ball-site.netlify.app/admin/.
    </p>
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        document.getElementById('cms-local-note').style.display = 'block';
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.4.0/dist/decap-cms.js"></script>
  </body>
</html>
