backend:
  name: github
  repo: shtungfutures-lgtm/rhuys-volley-ball
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: rhuys-volley-ball-site.netlify.app

local_backend: true
media_folder: "uploads/images"
public_folder: "/uploads/images"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    files:
      - label: "Liste des articles"
        name: "articles"
        file: "content/articles/articles.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              -
                label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Matchs", "Club", "Événements", "Jeunes", "Annonces"]
              - { label: "Image principale", name: "featured_image", widget: "image", required: false }
              - { label: "Extrait", name: "excerpt", widget: "text" }
              - { label: "Contenu", name: "body", widget: "markdown" }
              - { label: "Auteur", name: "author", widget: "string", default: "RHUYS VOLLEY BALL" }
