backend:
  name: git-gateway
  branch: main

local_backend: true
site_url: "https://rhuys-volley-ball-site.netlify.app"
display_url: "https://rhuys-volley-ball-site.netlify.app"
media_folder: "uploads/images"
public_folder: "/uploads/images"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    files:
      - label: "Liste des articles"
        name: "articles"
        file: "content/articles/articles.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Matchs", "Club", "Événements", "Jeunes", "Annonces"]
              - { label: "Image principale", name: "image", widget: "image", required: false }
              - { label: "Extrait", name: "excerpt", widget: "text" }
              - { label: "Contenu", name: "body", widget: "markdown" }
              - { label: "Auteur", name: "author", widget: "string", required: false, default: "RHUYS VOLLEY BALL" }

  - name: "gallery"
    label: "Galerie photos"
    label_singular: "Photo"
    files:
      - label: "Photos"
        name: "gallery"
        file: "content/gallery/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "gallery"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Club", "Matchs", "Jeunes", "Événements", "Entraînements"]
                default: "Club"

  - name: "training"
    label: "Horaires entraînement"
    label_singular: "Créneau"
    files:
      - label: "Planning des entraînements"
        name: "training"
        file: "content/training/training.json"
        format: "json"
        fields:
          - label: "Créneaux"
            name: "training"
            widget: "list"
            summary: "{{fields.team}} - {{fields.day}} {{fields.time}}"
            fields:
              - { label: "Équipe", name: "team", widget: "string" }
              - { label: "Âge / niveau", name: "age", widget: "string", required: false }
              - label: "Jour"
                name: "day"
                widget: "select"
                options: ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"]
              - { label: "Horaire", name: "time", widget: "string", hint: "Exemple : 16h00 - 17h30" }
              - { label: "Ville", name: "location", widget: "string", hint: "Exemple : Sarzeau" }
              - { label: "Lieu précis", name: "venue", widget: "string", required: false, hint: "Exemple : Gymnase de Sarzeau" }
              - { label: "Description", name: "description", widget: "text", required: false }

  - name: "products"
    label: "Produits boutique"
    label_singular: "Produit"
    files:
      - label: "Catalogue boutique"
        name: "products"
        file: "content/products/products.json"
        format: "json"
        fields:
          - label: "Produits"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Prix", name: "price", widget: "string" }
              - label: "Tailles"
                name: "sizes"
                widget: "list"
                required: false
                field: { label: "Taille", name: "size", widget: "string" }
              - { label: "Description courte", name: "shortDescription", widget: "text" }
              - { label: "Description complète", name: "detailedDescription", widget: "markdown" }
              - { label: "Lien Stripe", name: "stripeLink", widget: "string", required: false }
              - { label: "ID prix Stripe", name: "priceId", widget: "string", required: false, hint: "Nécessaire pour le paiement Stripe Checkout dynamique." }
              - label: "Statut"
                name: "status"
                widget: "select"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Indisponible", value: "indisponible" }
                default: "indisponible"

  - name: "partners"
    label: "Partenaires"
    label_singular: "Partenaire"
    files:
      - label: "Liste des partenaires"
        name: "partners"
        file: "content/partners/partners.json"
        format: "json"
        fields:
          - label: "Partenaires"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Partenaire principal", "Partenaire local", "Institutionnel", "Équipementier"]
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Lien du site", name: "website", widget: "string", required: false }

  - name: "pages"
    label: "Contenus du site"
    label_singular: "Page"
    files:
      - label: "Accueil"
        name: "accueil"
        file: "content/pages/accueil.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Le club"
        name: "club"
        file: "content/pages/club.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Horaires"
        name: "horaires"
        file: "content/pages/horaires.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
