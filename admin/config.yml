backend:
  name: git-gateway
  branch: main

local_backend: true
site_url: "https://rhuys-volley-ball-site.netlify.app"
display_url: "https://rhuys-volley-ball-site.netlify.app"
logo_url: "/assets/logo-rhuys-volley-ball.png"
locale: "fr"
show_preview_links: true
media_folder: "uploads/images"
public_folder: "/uploads/images"
# Note sécurité : privilégier les imports JPG, JPEG, PNG ou WebP.
# Decap CMS ne bloque pas toujours les extensions depuis config.yml selon le média backend utilisé.

collections:
  - name: "articles"
    label: "1. Actualités"
    label_singular: "Article"
    description: "Créer, modifier et organiser les articles visibles sur la page Actualités."
    files:
      - label: "Liste des articles"
        name: "articles"
        file: "content/articles/articles.json"
        format: "json"
        fields:
          - label: "Articles publiés"
            name: "articles"
            widget: "list"
            summary: "{{fields.date}} · {{fields.category}} · {{fields.title}}"
            collapsed: true
            minimize_collapsed: true
            hint: "Ajoutez un article, remplissez son titre, sa date, son image et son contenu, puis publiez."
            fields:
              - { label: "Titre de l’article", name: "title", widget: "string", hint: "Exemple : Victoire des loisirs à domicile." }
              - { label: "Date de publication", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Matchs", "Club", "Événements", "Jeunes", "Annonces"]
              - { label: "Image principale", name: "image", widget: "image", required: false, hint: "Format recommandé : JPG, PNG ou WebP." }
              - { label: "Résumé court", name: "excerpt", widget: "text", hint: "Deux phrases maximum pour la carte d’actualité." }
              - { label: "Contenu complet", name: "body", widget: "markdown", hint: "Texte complet affiché sur la page de l’article." }
              - { label: "Auteur", name: "author", widget: "string", required: false, default: "RHUYS VOLLEY BALL" }

  - name: "gallery"
    label: "2. Galerie photos"
    label_singular: "Photo"
    description: "Gérer les images de la galerie du site."
    files:
      - label: "Photos"
        name: "gallery"
        file: "content/gallery/gallery.json"
        format: "json"
        fields:
          - label: "Photos affichées"
            name: "gallery"
            widget: "list"
            summary: "{{fields.category}} · {{fields.title}}"
            collapsed: true
            minimize_collapsed: true
            fields:
              - { label: "Titre de repère", name: "title", widget: "string", hint: "Nom interne utile pour retrouver la photo." }
              - { label: "Image", name: "image", widget: "image", hint: "Format recommandé : JPG, PNG ou WebP." }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Club", "Matchs", "Jeunes", "Événements", "Entraînements"]
                default: "Club"

  - name: "training"
    label: "3. Horaires entraînement"
    label_singular: "Créneau"
    description: "Modifier les jours, horaires et lieux d’entraînement."
    files:
      - label: "Planning des entraînements"
        name: "training"
        file: "content/training/training.json"
        format: "json"
        fields:
          - label: "Créneaux"
            name: "training"
            widget: "list"
            summary: "{{fields.team}} - {{fields.day}} {{fields.time}}"
            collapsed: true
            minimize_collapsed: true
            fields:
              - { label: "Équipe", name: "team", widget: "string" }
              - { label: "Âge / niveau", name: "age", widget: "string", required: false }
              - label: "Jour"
                name: "day"
                widget: "select"
                options: ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"]
              - { label: "Horaire", name: "time", widget: "string", hint: "Exemple : 16h00 - 17h30" }
              - { label: "Ville", name: "location", widget: "string", hint: "Exemple : Sarzeau" }
              - { label: "Lieu précis", name: "venue", widget: "string", required: false, hint: "Exemple : Gymnase de Sarzeau" }
              - { label: "Description", name: "description", widget: "text", required: false }

  - name: "products"
    label: "4. Boutique"
    label_singular: "Produit"
    description: "Gérer les produits visibles dans la boutique et leurs identifiants Stripe."
    files:
      - label: "Catalogue boutique"
        name: "products"
        file: "content/products/products.json"
        format: "json"
        fields:
          - label: "Produits affichés"
            name: "products"
            widget: "list"
            summary: "{{fields.status}} · {{fields.name}} · {{fields.price}}"
            collapsed: true
            minimize_collapsed: true
            fields:
              - { label: "Nom du produit", name: "name", widget: "string" }
              - { label: "Image du produit", name: "image", widget: "image", required: false, hint: "Format recommandé : JPG, PNG ou WebP." }
              - { label: "Prix affiché", name: "price", widget: "string", hint: "Exemple : 45 €" }
              - label: "Tailles"
                name: "sizes"
                widget: "list"
                required: false
                field: { label: "Taille", name: "size", widget: "string" }
              - { label: "Description courte", name: "shortDescription", widget: "text" }
              - { label: "Description complète", name: "detailedDescription", widget: "markdown" }
              - { label: "Lien Stripe Payment Link", name: "stripeLink", widget: "string", required: false }
              - { label: "ID prix Stripe", name: "priceId", widget: "string", required: false, hint: "Nécessaire pour le paiement Stripe Checkout dynamique." }
              - label: "Statut"
                name: "status"
                widget: "select"
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Indisponible", value: "indisponible" }
                default: "indisponible"

  - name: "partners"
    label: "5. Partenaires"
    label_singular: "Partenaire"
    description: "Mettre en avant les partenaires et sponsors du club."
    files:
      - label: "Liste des partenaires"
        name: "partners"
        file: "content/partners/partners.json"
        format: "json"
        fields:
          - label: "Partenaires"
            name: "partners"
            widget: "list"
            summary: "{{fields.category}} · {{fields.name}}"
            collapsed: true
            minimize_collapsed: true
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Format recommandé : JPG, PNG ou WebP." }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["Partenaire principal", "Partenaire local", "Institutionnel", "Équipementier"]
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Lien du site", name: "website", widget: "string", required: false }

  - name: "pages"
    label: "6. Textes des pages"
    label_singular: "Page"
    description: "Modifier les grands titres, textes courts et images principales des pages."
    files:
      - label: "Accueil"
        name: "accueil"
        file: "content/pages/accueil.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Le club"
        name: "club"
        file: "content/pages/club.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Horaires"
        name: "horaires"
        file: "content/pages/horaires.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Planning"
        name: "planning"
        file: "content/pages/planning.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.json"
        format: "json"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "content", widget: "text" }
          - { label: "Image", name: "image", widget: "image", required: false }
